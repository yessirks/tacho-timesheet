// Tuki for Android: a Trusted Web Activity that opens the Tuki web app full-screen in Chrome.
// Built on GitHub Actions (.github/workflows/android.yml); the signing key comes from repo secrets.
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.yessirks.trukia'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.yessirks.trukia'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'trukia'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // no key (e.g. a check build): produce an unsigned APK instead of failing
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.androidbrowserhelper:locationdelegation:1.1.1'
}
